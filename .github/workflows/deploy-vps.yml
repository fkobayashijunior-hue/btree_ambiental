name: VPS - status do mecanismo de deploy

# A produção usa o atualizador instalado no VPS, que busca origin/main.
# Não disparar SSH em pushes enquanto os secrets de Actions não estiverem
# configurados e essa migração de deploy não tiver sido validada.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-info:
    name: Informar fluxo atual (sem implantar)
    runs-on: ubuntu-latest
    steps:
      - name: Mecanismo de produção
        run: |
          echo 'Este workflow não executa deploy.'
          echo 'O VPS consulta origin/main a cada 2 minutos e reinicia o BTREE quando há uma nova versão.'
          echo 'Mudanças devem incluir dist/ compilado; migrações de banco exigem aplicação controlada antes do push.'
